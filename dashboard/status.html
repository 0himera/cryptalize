<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTALIZE // STATUS</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <script src="/static/app.js?v=2" defer></script>
</head>
<body>
    <div id="crt-overlay"></div>
    <div id="hex-grid"></div>
    
    <div id="container">
        <header>
            <div class="logo-section">
                <span>RENAQU // SYSTEM</span>
                <h1>STATUS MONITOR</h1>
            </div>
            <div class="header-info">
                <div class="cy">PUBLIC ACCESS</div>
                <div class="cy" id="current-time">2026-04-26 13:30:04.562 UTC</div>
                <div class="co"><a href="/dashboard" style="color: inherit; text-decoration: none;">[ ACCESS DASHBOARD ]</a></div>
            </div>
        </header>

        <main>
            <div id="overall-status-box" class="system-status operational">
                <div class="status-main">
                    <div class="service-icon">
                        <img src="/assets/status-operational.svg" id="main-status-icon" alt="Status">
                    </div>
                    <div class="status-text">
                        <div class="cy" style="font-size: 12px;">OVERALL SYSTEM STATUS</div>
                        <h2 id="overall-status-text" class="cg">OPERATIONAL</h2>
                    </div>
                </div>
                <div class="status-info" style="text-align: right;">
                    <div class="cg" id="nominal-count">4 / 4 NOMINAL</div>
                    <div class="co">POLL 15s</div>
                </div>
            </div>

            <div class="legend" style="display: flex; gap: 20px; margin-bottom: 20px; font-size: 12px;">
                <div class="cg">• OPERATIONAL</div>
                <div class="cy">• DEGRADED</div>
                <div class="cr">• FAILURE</div>
            </div>

            <div class="section-title co" style="margin-bottom: 10px; font-size: 14px;">
                SERVICES [<span id="services-count">4</span>]
            </div>

            <div id="services-list" class="services">
                <!-- Services will be injected here -->
                <div class="co">INITIALIZING NEURAL LINK...</div>
            </div>
        </main>

        <footer style="margin-top: 40px; border-top: 1px solid rgba(255,135,61,0.2); padding-top: 10px; font-size: 10px; color: rgba(255,255,255,0.4);">
            © 2026 CRYPTALIZE // MAGI SYSTEM // NERV-01
        </footer>
    </div>

    <script>
        window.addEventListener('load', () => {
            if (typeof initStatusPage === 'function') initStatusPage();
        });
    </script>
</body>
</html>
