version: '3.8'

services:
  # Event Streaming (Kafka Compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: cryptalize-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Analytical Database (OLAP)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: cryptalize-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin
      - CLICKHOUSE_DB=cryptalize
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./proto:/var/lib/clickhouse/format_schemas
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptalize_net

  brain:
    build: ./api-py
    container_name: cryptalize-brain
    ports:
      - "8001:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - cryptalize_net

  # Relational Database (OLTP)
  postgres:
    image: postgres:16-alpine
    container_name: cryptalize-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=cryptalize
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Real-time State & Cache
  redis:
    image: redis:7-alpine
    container_name: cryptalize-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
